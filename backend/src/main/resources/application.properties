spring.application.name=backend
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/avyra
spring.datasource.username=root
# FIX: Replaced hardcoded password with environment variable
spring.datasource.password=${DB_PASSWORD:default_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# FIX: Replaced hardcoded JWT secret with environment variable
jwt.secret=${JWT_SECRET:default_insecure_secret_for_dev_only}
jwt.expiration.ms=86400000

huggingface.model=bloomz-560m
huggingface.model.llm=meta-llama/Llama-3.3-70B-Instruct

# FIX: Replaced hardcoded API keys with environment variables
HUGGINGFACE_API_KEY=${HUGGING FACE_API_KEY:}
OPENAI_API_KEY=${OPENAI_API_KEY:}

paypal.client-id=${PAYPAL_CLIENT_ID:YOUR_PAYPAL_SANDBOX_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:YOUR_PAYPAL_SANDBOX_CLIENT_SECRET}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# Server Configuration
server.port=8080

# CORS Configuration (Note: We will fix the '*' wildcard in Vulnerability #2)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.downloads.path=F:/Avyra/frontend/public/downloads
download.files.path=F:/Avyra/frontend/public/downloads